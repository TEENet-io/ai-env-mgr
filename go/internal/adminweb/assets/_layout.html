{{define "head"}}<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}} · AI 环境管理</title>
<link rel="stylesheet" href="/static/app.css">
</head>{{end}}

{{define "nav"}}
<header>
  <nav>
    <a href="/machines"{{if eq .Nav "machines"}} class="active"{{end}}>机器</a>
    <a href="/users"{{if eq .Nav "users"}} class="active"{{end}}>用户</a>
    <a href="/sites"{{if eq .Nav "sites"}} class="active"{{end}}>网站拦截</a>
    <a href="/rollout"{{if eq .Nav "rollout"}} class="active"{{end}}>发布</a>
    <a href="/files"{{if eq .Nav "files"}} class="active"{{end}}>文件</a>
    <a href="/settings"{{if eq .Nav "settings"}} class="active"{{end}}>设置</a>
    <a href="/policy"{{if eq .Nav "policy"}} class="active"{{end}}>策略总览</a>
  </nav>
  <span class="muted">{{.Bucket}}</span>
  <form method="post" action="/logout"><button class="link">退出</button></form>
</header>
{{end}}

{{define "notices"}}
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .OK}}<p class="ok-banner">已保存</p>{{end}}
{{end}}
