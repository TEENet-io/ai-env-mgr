{{define "ticket_change_customer_form"}}{{if .Workflow.AwaitingConfirmation}}<h2>客户结果确认</h2><p class="hint">请核对上方实施方记录。确认只记录结果，不会自动变更设备或网站策略。</p><form method="post" action="/customer/ticket/confirm-change" class="form panel"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="id" value="{{.Ticket.ID}}"><input type="hidden" name="version" value="{{.Ticket.Version}}"><label>确认结果<select name="confirmation_result" required><option value="">请选择</option><option value="completed">已按申请内容完成</option><option value="partial">部分完成，遗留问题见上表</option><option value="not_completed">未完成，需重新排期</option></select></label><label>客户联系人<input name="confirmation_contact" maxlength="100" required></label><label>联系人签名（电子填写）<input name="confirmation_signature" maxlength="100" required></label><label>确认日期<input name="confirmation_date" type="date" required></label><button>提交确认</button></form>{{end}}{{end}}
