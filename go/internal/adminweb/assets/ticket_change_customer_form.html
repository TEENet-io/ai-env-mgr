{{define "ticket_change_customer_form"}}{{if .Workflow.AwaitingConfirmation}}<h2>客戶結果確認</h2><p class="hint">請核對上方實施方記錄。確認只記錄結果，不會自動變更設備或網站策略。</p><form method="post" action="/customer/ticket/confirm-change" class="form panel"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="id" value="{{.Ticket.ID}}"><input type="hidden" name="version" value="{{.Ticket.Version}}"><label>確認結果<select name="confirmation_result" required><option value="">請選擇</option><option value="completed">已按申請內容完成</option><option value="partial">部分完成，遺留問題見上表</option><option value="not_completed">未完成，需重新排期</option></select></label><label>客戶聯絡人<input name="confirmation_contact" maxlength="100" required></label><label>聯絡人簽名（電子填寫）<input name="confirmation_signature" maxlength="100" required></label><label>確認日期<input name="confirmation_date" type="date" required></label><button>提交確認</button></form>{{end}}{{end}}
