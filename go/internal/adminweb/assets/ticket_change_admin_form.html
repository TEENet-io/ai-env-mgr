{{define "ticket_change_admin_form"}}<h2>实施方填写</h2><p class="hint">申请编号 #{{.Ticket.Number}}。每次保存都会留存一版执行记录并写入审计。这里的实施阶段与上方工单状态分别记录，不会自动执行环境变更。</p><form method="post" action="/tickets/action" class="form panel"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="id" value="{{.Ticket.ID}}"><input type="hidden" name="version" value="{{.Ticket.Version}}"><input type="hidden" name="action" value="change_result">
<label>当前状态<select name="result_stage" required><option value="">请选择</option><option value="need_info"{{if eq (ticketField .Workflow.Implementation "stage") "need_info"}} selected{{end}}>待补信息</option><option value="assessing"{{if eq (ticketField .Workflow.Implementation "stage") "assessing"}} selected{{end}}>评估中</option><option value="waiting_customer_approval"{{if eq (ticketField .Workflow.Implementation "stage") "waiting_customer_approval"}} selected{{end}}>待客户确认</option><option value="scheduled"{{if eq (ticketField .Workflow.Implementation "stage") "scheduled"}} selected{{end}}>已排期</option><option value="executing"{{if eq (ticketField .Workflow.Implementation "stage") "executing"}} selected{{end}}>执行中</option><option value="verifying"{{if eq (ticketField .Workflow.Implementation "stage") "verifying"}} selected{{end}}>待验证</option><option value="waiting_customer_result"{{if eq (ticketField .Workflow.Implementation "stage") "waiting_customer_result"}} selected{{end}}>待客户确认结果</option><option value="closed"{{if eq (ticketField .Workflow.Implementation "stage") "closed"}} selected{{end}}>已关闭</option><option value="cancelled"{{if eq (ticketField .Workflow.Implementation "stage") "cancelled"}} selected{{end}}>已取消</option><option value="not_executing"{{if eq (ticketField .Workflow.Implementation "stage") "not_executing"}} selected{{end}}>不执行</option></select></label>
<label>信息缺项／需客户确认<textarea name="result_missing" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_missing"}}</textarea></label><label>影响评估<textarea name="result_impact" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_impact"}}</textarea></label><label>计划执行时间<input name="result_planned_at" type="datetime-local" value="{{ticketField .Workflow.Implementation "result_planned_at"}}"></label><label>执行人<input name="result_executor" maxlength="100" value="{{ticketField .Workflow.Implementation "result_executor"}}"></label><label>验证人<input name="result_verifier" maxlength="100" value="{{ticketField .Workflow.Implementation "result_verifier"}}"></label><label>回滚方式<textarea name="result_rollback" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_rollback"}}</textarea></label><label>执行结果<textarea name="result_execution" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_execution"}}</textarea></label><label>测试结果／证据位置<textarea name="result_test_evidence" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_test_evidence"}}</textarea></label><label>实际生效范围或版本<input name="result_actual_scope" maxlength="1000" value="{{ticketField .Workflow.Implementation "result_actual_scope"}}"></label><label>遗留问题／后续申请编号<input name="result_followup" maxlength="1000" value="{{ticketField .Workflow.Implementation "result_followup"}}"></label><label>实施负责人<input name="result_lead" maxlength="100" value="{{ticketField .Workflow.Implementation "result_lead"}}"></label><label>日期<input name="result_date" type="date" value="{{ticketField .Workflow.Implementation "result_date"}}"></label><button>保存实施记录</button></form>{{end}}
