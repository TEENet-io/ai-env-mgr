{{define "ticket_change_admin_form"}}<h2>實施方填寫</h2><p class="hint">申請編號 #{{.Ticket.Number}}。每次保存都會留存一版執行記錄並寫入審計。這裡的實施階段與上方工單狀態分別記錄，不會自動執行環境變更。</p><form method="post" action="/tickets/action" class="form panel"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="id" value="{{.Ticket.ID}}"><input type="hidden" name="version" value="{{.Ticket.Version}}"><input type="hidden" name="action" value="change_result">
<label>當前狀態<select name="result_stage" required><option value="">請選擇</option><option value="need_info"{{if eq (ticketField .Workflow.Implementation "stage") "need_info"}} selected{{end}}>待補信息</option><option value="assessing"{{if eq (ticketField .Workflow.Implementation "stage") "assessing"}} selected{{end}}>評估中</option><option value="waiting_customer_approval"{{if eq (ticketField .Workflow.Implementation "stage") "waiting_customer_approval"}} selected{{end}}>待客戶確認</option><option value="scheduled"{{if eq (ticketField .Workflow.Implementation "stage") "scheduled"}} selected{{end}}>已排期</option><option value="executing"{{if eq (ticketField .Workflow.Implementation "stage") "executing"}} selected{{end}}>執行中</option><option value="verifying"{{if eq (ticketField .Workflow.Implementation "stage") "verifying"}} selected{{end}}>待驗證</option><option value="waiting_customer_result"{{if eq (ticketField .Workflow.Implementation "stage") "waiting_customer_result"}} selected{{end}}>待客戶確認結果</option><option value="closed"{{if eq (ticketField .Workflow.Implementation "stage") "closed"}} selected{{end}}>已關閉</option><option value="cancelled"{{if eq (ticketField .Workflow.Implementation "stage") "cancelled"}} selected{{end}}>已取消</option><option value="not_executing"{{if eq (ticketField .Workflow.Implementation "stage") "not_executing"}} selected{{end}}>不執行</option></select></label>
<label>信息缺項／需客戶確認<textarea name="result_missing" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_missing"}}</textarea></label><label>影響評估<textarea name="result_impact" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_impact"}}</textarea></label><label>計劃執行時間<input name="result_planned_at" type="datetime-local" value="{{ticketField .Workflow.Implementation "result_planned_at"}}"></label><label>執行人<input name="result_executor" maxlength="100" value="{{ticketField .Workflow.Implementation "result_executor"}}"></label><label>驗證人<input name="result_verifier" maxlength="100" value="{{ticketField .Workflow.Implementation "result_verifier"}}"></label><label>回滾方式<textarea name="result_rollback" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_rollback"}}</textarea></label><label>執行結果<textarea name="result_execution" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_execution"}}</textarea></label><label>測試結果／證據位置<textarea name="result_test_evidence" maxlength="2000" rows="2">{{ticketField .Workflow.Implementation "result_test_evidence"}}</textarea></label><label>實際生效範圍或版本<input name="result_actual_scope" maxlength="1000" value="{{ticketField .Workflow.Implementation "result_actual_scope"}}"></label><label>遺留問題／後續申請編號<input name="result_followup" maxlength="1000" value="{{ticketField .Workflow.Implementation "result_followup"}}"></label><label>實施負責人<input name="result_lead" maxlength="100" value="{{ticketField .Workflow.Implementation "result_lead"}}"></label><label>日期<input name="result_date" type="date" value="{{ticketField .Workflow.Implementation "result_date"}}"></label><button>保存實施記錄</button></form>{{end}}
