{{define "customer_login.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>客户工单登录 · TEENet</title><link rel="stylesheet" href="/static/ticket-portal.css"></head><body class="tp-body tp-login-body"><main class="tp-login-card"><a class="tp-brand" href="/customer"><span class="tp-brand-mark">T</span><span><strong>TEENet</strong><small>WORKSPACE SERVICES</small></span></a><p class="tp-eyebrow">CUSTOMER SERVICE PORTAL</p><h1>工作间服务，随时响应</h1><p>登录后提交请求、查看处理进度并与服务团队沟通。账号由服务团队邀请开通。</p>{{if .Error}}<p class="tp-login-error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/customer/login" class="tp-login-form"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>工作邮箱<input name="email" type="email" required autocomplete="username" placeholder="name@company.com"></label><label>密码<input name="password" type="password" required autocomplete="current-password" placeholder="输入密码"></label><button class="tp-button tp-button-primary" type="submit">登录工单中心 →</button></form><p class="tp-login-help">无法登录工单系统？请通过与服务团队约定的支持渠道联系。</p></main></body></html>{{end}}
