{{define "customer_login.html"}}<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>客戶工單登入 · TEENet</title><link rel="stylesheet" href="{{static "ticket-portal.css"}}"></head><body class="tp-body tp-login-body"><main class="tp-login-card"><a class="tp-brand" href="/customer"><span class="tp-brand-mark">T</span><span><strong>TEENet</strong><small>WORKSPACE SERVICES</small></span></a><p class="tp-eyebrow">CUSTOMER SERVICE PORTAL</p><h1>工作間服務，隨時響應</h1><p>登入後提交請求、查看處理進度並與服務團隊溝通。帳號由服務團隊邀請開通。</p>{{if .Error}}<p class="tp-login-error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/customer/login" class="tp-login-form"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>工作郵箱<input name="email" type="email" required autocomplete="username" placeholder="name@company.com"></label><label>密碼<input name="password" type="password" required autocomplete="current-password" placeholder="輸入密碼"></label><button class="tp-button tp-button-primary" type="submit">登入工單中心 →</button></form><p class="tp-login-help">無法登入工單系統？請通過與服務團隊約定的支持渠道聯絡。</p></main></body></html>{{end}}
