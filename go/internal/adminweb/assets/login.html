{{define "login.html"}}<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 环境管理 · 登录</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="centred">
<main class="card">
  <h1>AI 环境管理</h1>
  <p class="muted">用你的 OSS AccessKey 登录。凭证只保存在本次会话的内存中，不会写入磁盘。</p>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <form method="post" action="/login" autocomplete="off">
    {{if .Fixed}}
    <table class="kv fixed-loc">
      <tbody>
        <tr><th>Bucket</th><td>{{.Bucket}}</td></tr>
        <tr><th>Endpoint</th><td>{{.Endpoint}}</td></tr>
      </tbody>
    </table>
    {{else}}
    <label>Endpoint
      <input name="endpoint" required placeholder="oss-ap-southeast-1.aliyuncs.com" value="{{.Endpoint}}">
    </label>
    <label>Bucket
      <input name="bucket" required placeholder="ai-collect-sg" value="{{.Bucket}}">
    </label>
    {{end}}
    <label>AccessKey ID
      <input name="accessKeyId" required autocomplete="off" autofocus>
    </label>
    <label>AccessKey Secret
      <input name="accessKeySecret" type="password" required autocomplete="off">
    </label>
    <button type="submit">登录</button>
  </form>
</main>
</body>
</html>{{end}}
