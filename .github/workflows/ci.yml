name: CI

# Pull requests run the development gate. Release tags run the same gate in
# release.yml immediately before building and publishing the binaries, so a
# normal push does not run the same checks twice.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: make check
        working-directory: go
        run: make check
