name: Release

# On a version tag (e.g. v1.2.0), build the binaries and attach them to a
# GitHub Release so they can be downloaded directly.
#
#   agent.exe            windows -- credential-free; enrols with the console
#                        and uses short-lived signed links for objects.
#                        Built once per deployment (see DEPLOYMENTS below):
#                        each copy has its console built in and goes to that
#                        deployment's bucket. The release page carries the
#                        test one as agent.exe and the others as
#                        agent-<deployment>.exe.
#   admin-<os>-<arch>    linux/windows/macos, NO key -- the admin enters OSS
#                        credentials interactively at runtime (nothing saved to
#                        disk). The full read-write key must never be baked into
#                        a published artifact.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify (make check)
        working-directory: go
        run: make check

      - name: Build agent.exe (windows, console only)
        working-directory: go
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # The console each agent.exe enrols with and takes instructions
          # from. Not a secret, but changing one hands that whole fleet to
          # another server, so they live here and change only by commit.
          # Never repoint an existing deployment's line: its machines would
          # follow the next upgrade to the new address.
          #   name   console                                   output
          DEPLOYMENTS=(
            "test  https://windows-control.teenet.app    ../dist/agent.exe"
            "bippo https://bippo-workspace.teenet.app    ../dist/agent-bippo.exe"
          )
          for line in "${DEPLOYMENTS[@]}"; do
            read -r name url out <<<"$line"
            # Bare https origin only: no http, no path, no trailing slash.
            if ! [[ "${url}" =~ ^https://[a-z0-9.-]+(:[0-9]+)?$ ]]; then
              echo "::error::${name}: console is not a bare https origin: '${url}'"
              exit 1
            fi
            GOOS=windows GOARCH=amd64 go build -trimpath \
              -ldflags "-s -w -X main.version=${VER} -X main.consoleURL=${url}" -o "${out}" ./cmd/agent
            echo "agent.exe (${name}): console ${url} built in -> ${out}"
          done

      # admin: no key, ever. The administrator enters credentials in the console
      # at sign-in and they stay in memory -- including for the cloud desktop
      # lookup, which only runs while a page is being rendered and so never
      # needs a credential of its own.
      - name: Build admin (linux/windows/macos, no key)
        working-directory: go
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          LD="-s -w -X main.version=${VER}"
          build() { GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "${LD}" -o "../dist/$3" ./cmd/admin; }
          build linux   amd64 admin-linux-amd64
          build windows amd64 admin-windows-amd64.exe
          build darwin  arm64 admin-darwin-arm64

      - name: Checksums
        working-directory: dist
        run: sha256sum agent.exe agent-bippo.exe admin-linux-amd64 admin-windows-amd64.exe admin-darwin-arm64 | tee SHA256SUMS.txt

      # Put agent.exe where the console's version library expects it, so the
      # 10 MB binary never has to pass through the console host. A dedicated
      # Prefer the dedicated OSS_CI_* upload key. Existing repositories may
      # still have only AGENT_OSS_* secrets: they are used by this CI upload
      # step only and are never linked into agent.exe.
      # An existing object is never overwritten -- a version names one set
      # of bytes -- so a re-cut of the same tag fails here on purpose.
      - name: Upload agent.exe to the OSS version library (test)
        env:
          OSS_CI_ACCESS_KEY_ID: ${{ secrets.OSS_CI_ACCESS_KEY_ID || secrets.AGENT_OSS_ACCESS_KEY_ID }}
          OSS_CI_ACCESS_KEY_SECRET: ${{ secrets.OSS_CI_ACCESS_KEY_SECRET || secrets.AGENT_OSS_ACCESS_KEY_SECRET }}
          OSS_CI_BUCKET: ${{ secrets.OSS_CI_BUCKET || secrets.AGENT_OSS_BUCKET }}
          OSS_CI_ENDPOINT: ${{ secrets.OSS_CI_ENDPOINT || secrets.AGENT_OSS_ENDPOINT }}
        # No silent success: a release the console cannot see is not a release.
        run: .github/scripts/upload-agent.sh test dist/agent.exe required

      # Bippo's production bucket, with its own upload key. Until all four
      # OSS_CI_BIPPO_* secrets are set this is skipped with a warning, so a
      # test release still goes out; half of them set is an error.
      - name: Upload agent.exe to the OSS version library (bippo)
        env:
          OSS_CI_ACCESS_KEY_ID: ${{ secrets.OSS_CI_BIPPO_ACCESS_KEY_ID }}
          OSS_CI_ACCESS_KEY_SECRET: ${{ secrets.OSS_CI_BIPPO_ACCESS_KEY_SECRET }}
          OSS_CI_BUCKET: ${{ secrets.OSS_CI_BIPPO_BUCKET }}
          OSS_CI_ENDPOINT: ${{ secrets.OSS_CI_BIPPO_ENDPOINT }}
        run: .github/scripts/upload-agent.sh bippo dist/agent-bippo.exe optional

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: if a release for this tag already exists (a re-cut of
          # the same version), delete it first -- `gh release create` refuses to
          # overwrite. The git tag itself is kept (no --cleanup-tag), so moving
          # the tag and re-pushing it re-publishes cleanly.
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" \
            dist/agent.exe dist/agent-bippo.exe \
            dist/admin-linux-amd64 dist/admin-windows-amd64.exe dist/admin-darwin-arm64 \
            dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/RELEASE_NOTES.md
