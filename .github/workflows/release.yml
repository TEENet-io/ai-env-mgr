name: Release

# On a version tag (e.g. v1.2.0), build the Windows binaries and attach them
# to a GitHub Release so they can be downloaded directly.
#
# agent.exe gets the RESTRICTED agent OSS key injected from repo secrets at
# link time (-ldflags -X), so it is ready to run. admin.exe is built WITHOUT
# any key -- the administrator's full read-write key must never be baked into a
# published artifact -- so it stays a credential-less template.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify (make check)
        working-directory: go
        run: make check

      # Secrets arrive via env (never interpolated into the script), and GitHub
      # masks their values in logs. The agent restricted key is injected into
      # agent.exe only; admin.exe is built with no key at all.
      #
      # Injection is via -ldflags -X on the string vars in cmd/agent/
      # credentials.go, so nothing is written to disk. OSS bucket/endpoint/keys
      # contain no spaces, which is what keeps the space-split ldflags safe.
      - name: Build Windows binaries
        working-directory: go
        env:
          AGENT_OSS_BUCKET: ${{ secrets.AGENT_OSS_BUCKET }}
          AGENT_OSS_ENDPOINT: ${{ secrets.AGENT_OSS_ENDPOINT }}
          AGENT_OSS_ACCESS_KEY_ID: ${{ secrets.AGENT_OSS_ACCESS_KEY_ID }}
          AGENT_OSS_ACCESS_KEY_SECRET: ${{ secrets.AGENT_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"

          AGENT_LDFLAGS="-s -w -X main.version=${VER}"
          if [ -n "${AGENT_OSS_ACCESS_KEY_ID}" ]; then
            AGENT_LDFLAGS="${AGENT_LDFLAGS} -X main.ossBucket=${AGENT_OSS_BUCKET} -X main.ossAccessKeyID=${AGENT_OSS_ACCESS_KEY_ID} -X main.ossAccessKeySecret=${AGENT_OSS_ACCESS_KEY_SECRET}"
            if [ -n "${AGENT_OSS_ENDPOINT}" ]; then
              AGENT_LDFLAGS="${AGENT_LDFLAGS} -X main.ossEndpoint=${AGENT_OSS_ENDPOINT}"
            fi
            echo "agent.exe: restricted OSS credentials injected (config=built-in)"
          else
            echo "::warning::AGENT_OSS_ACCESS_KEY_ID secret is not set; building a credential-less template agent.exe"
          fi

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${AGENT_LDFLAGS}" -o ../dist/agent.exe ./cmd/agent
          # admin.exe: no key, ever -- credential-less template.
          make admin VERSION="${VER}"

      - name: Checksums
        working-directory: dist
        run: sha256sum agent.exe admin.exe | tee SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/agent.exe dist/admin.exe dist/SHA256SUMS.txt
          --title "$GITHUB_REF_NAME"
          --notes-file .github/RELEASE_NOTES.md
